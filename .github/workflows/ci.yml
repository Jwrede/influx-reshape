name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o influx-reshape .

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        influxdb: ["1.8", "1.11", "2.7", "2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Start InfluxDB ${{ matrix.influxdb }}
        run: |
          case "${{ matrix.influxdb }}" in
            1.*) docker run -d --name influx -p 8086:8086 influxdb:${{ matrix.influxdb }} ;;
            *) docker run -d --name influx -p 8086:8086 \
                 -e DOCKER_INFLUXDB_INIT_MODE=setup -e DOCKER_INFLUXDB_INIT_USERNAME=admin \
                 -e DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword -e DOCKER_INFLUXDB_INIT_ORG=ci \
                 -e DOCKER_INFLUXDB_INIT_BUCKET=irtest -e DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=citoken \
                 influxdb:${{ matrix.influxdb }} ;;
          esac
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8086/ping && break
            sleep 1
          done
          curl -sfI http://127.0.0.1:8086/ping | grep -i x-influxdb-version
          # 2.x answers /ping before the setup has finished
          sleep 5
      - name: End-to-end tests
        run: |
          export IR_URL=http://127.0.0.1:8086
          case "${{ matrix.influxdb }}" in
            1.*) ;;
            *) export IR_DB=irtest IR_TOKEN=citoken IR_ORG=ci ;;
          esac
          go test -count=1 -run E2E -v ./...
      - if: failure()
        run: docker logs influx 2>&1 | tail -100
